<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Aim Tracker logo: a crosshair with a rising score line inside it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#6c4dff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#shine)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- crosshair ring, with gaps where the ticks are -->
    <circle cx="32" cy="32" r="19" stroke-width="3.5" stroke-dasharray="21.85 8" stroke-dashoffset="-4"/>
    <!-- ticks -->
    <path d="M32 8 V17 M32 47 V56 M8 32 H17 M47 32 H56" stroke-width="3.5"/>
    <!-- rising score line -->
    <path d="M20 40 L27 34 L33 37 L43 25" stroke="#bff3ff" stroke-width="3.5"/>
  </g>
  <circle cx="43" cy="25" r="4" fill="#ffffff"/>
</svg>
