<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <!-- Safety: the page may only load files that ship with the app. No CDN, no web. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Aim Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The window has no normal title bar, so this strip lets you drag it. -->
  <div class="drag-strip"></div>

  <aside class="sidebar">
    <div class="brand">
      <img src="assets/logo.svg" alt="">
      <div>
        <strong>Aim Tracker</strong>
        <span>Din aim-journal</span>
      </div>
    </div>
    <nav id="nav">
      <button data-page="today" class="active"><span class="icon" data-icon="home"></span>I dag</button>
      <button data-page="scenarios"><span class="icon" data-icon="target"></span>Scenarier</button>
      <button data-page="radar"><span class="icon" data-icon="radar"></span>Radar</button>
      <button data-page="sessions"><span class="icon" data-icon="clock"></span>Sessioner</button>
      <button data-page="log"><span class="icon" data-icon="list"></span>Log</button>
      <button data-page="coach"><span class="icon" data-icon="chat"></span>Coach</button>
      <button data-page="settings"><span class="icon" data-icon="gear"></span>Indstillinger</button>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <main>
    <section id="page-today" class="page active"></section>
    <section id="page-scenarios" class="page"></section>
    <section id="page-radar" class="page"></section>
    <section id="page-sessions" class="page"></section>
    <section id="page-log" class="page"></section>
    <section id="page-coach" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="icons.js"></script>
  <script src="format.js"></script>
  <script src="charts.js"></script>
  <script src="pages/today.js"></script>
  <script src="pages/scenarios.js"></script>
  <script src="pages/radar.js"></script>
  <script src="pages/sessions.js"></script>
  <script src="pages/log.js"></script>
  <script src="pages/coach.js"></script>
  <script src="pages/settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
