# Builds the Windows installer and publishes it as a GitHub Release when
# you push a version tag (e.g. v0.3.0). The installed app finds new
# releases here and updates itself.
#
# The release is created as a draft first and published at the end. If
# electron-builder creates it itself, its parallel uploads can create two
# releases for the same tag, which confuses the auto-updater.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: gh release create ${{ github.ref_name }} --draft --title "${{ github.ref_name }}" --notes "Automatisk build af ${{ github.ref_name }}"
      - run: npx electron-builder --win --publish always
      # Code-only update: the app's code (app.asar) plus a small manifest with
      # its SHA-512 checksum. Installed apps download this instead of a new
      # installer, because Windows Smart App Control blocks unsigned installers.
      - name: Add code-only update
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $electron = (Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version
          $file = "app-$version.asar"
          Copy-Item dist/win-unpacked/resources/app.asar "dist/$file"
          $sha512 = (Get-FileHash "dist/$file" -Algorithm SHA512).Hash.ToLower()
          @{ version = $version; file = $file; sha512 = $sha512; electron = $electron } | ConvertTo-Json | Set-Content dist/app-update.json -Encoding utf8
          gh release upload ${{ github.ref_name }} "dist/$file" dist/app-update.json
      - run: gh release edit ${{ github.ref_name }} --draft=false --latest
