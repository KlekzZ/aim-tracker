# Builds the Windows installer and publishes it as a GitHub Release when
# you push a version tag (e.g. v0.2.0). The installed app finds new
# releases here and updates itself.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
